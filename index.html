/* Real-case task forms and local document evidence */
/* Высота формы считается флексом, а не вычитанием константы из высоты экрана.
   Запас под шапку был зашит числом (78/85px) в расчёте на однострочный заголовок.
   «Забор товара · MRB-000007» переносится на две строки, шапка становится 117px,
   и на экране 360×640 нижние 34px формы уходили под overflow:hidden вместе с

.prd-master{margin-top:14px;padding-bottom:0;overflow:hidden}.prd-master>.table-wrap{margin:0 -20px;width:calc(100% + 40px)}.prd-master table th:first-child,.prd-master table td:first-child{padding-left:20px}.prd-master table th:last-child,.prd-master table td:last-child{padding-right:20px}.prd-tabs{display:flex;gap:4px;margin:0 0 12px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}.prd-tabs button{min-height:31px;padding:5px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;font-weight:650;cursor:pointer}.prd-tabs button.active{background:var(--nav);color:#fff}.text-danger{color:var(--danger)!important}.prd-report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.prd-report-grid>article{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}.prd-report-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark)}.prd-report-icon svg{width:20px}.prd-report-grid span{color:var(--faint);font-family:var(--mono);font-size:8px}.prd-report-grid h3{margin:2px 0;font-size:12px}.prd-report-grid p{color:var(--muted);font-size:9px}.prd-report-actions{grid-column:1/-1;display:flex;gap:5px}.prd-report-actions button{flex:1;min-height:29px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:9px;font-weight:700;cursor:pointer}.prd-report-actions button:hover{border-color:var(--accent);color:var(--accent-dark)}.prd-period{display:flex;flex-direction:column;gap:3px;color:var(--faint);font-size:8px}.prd-period select{min-width:190px}.prd-submission-list{display:flex;flex-direction:column;gap:8px}.prd-submission-list article{padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}.prd-submission-list article>div{display:flex;justify-content:space-between;gap:8px}.prd-submission-list b{font-family:var(--mono);font-size:10px}.prd-submission-list p{margin:4px 0;color:var(--muted);font-size:9.5px}.prd-submission-list small{color:var(--faint);font-family:var(--mono);font-size:8px}.checksum{font-size:9px;color:var(--accent-dark)}.prd-exception-detail{padding:15px 18px}.prd-exception-detail>div:first-child{display:flex;gap:7px;margin-bottom:12px}.prd-exception-detail dl{display:grid;grid-template-columns:120px 1fr;gap:8px 15px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:10.5px}.prd-exception-detail dt{color:var(--muted)}.prd-exception-detail form{margin-top:13px}.prd-exception-detail form>label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:10px}.prd-exception-detail textarea{min-height:80px}.mfa-demo-code{margin:-3px 0 13px;padding:9px 11px;border:1px solid rgba(38,165,161,.22);border-radius:10px;background:var(--accent-soft);color:var(--muted);font-size:10px}.mfa-demo-code code{color:var(--accent-dark);font-weight:800;letter-spacing:.08em}
html[data-theme="dark"] .prd-tabs,html[data-theme="dark"] .prd-report-grid>article,html[data-theme="dark"] .prd-submission-list article,html[data-theme="dark"] .prd-exception-detail dl{background:rgba(13,27,44,.55);border-color:rgba(226,240,253,.09)}html[data-theme="dark"] .prd-report-actions button{background:rgba(255,255,255,.04);border-color:rgba(226,240,253,.09)}html[data-theme="dark"] .mfa-demo-code{background:rgba(38,165,161,.1);border-color:rgba(63,197,190,.2)}
@media(max-width:1100px){.prd-report-grid{grid-template-columns:1fr 1fr}}@media(max-width:720px){.prd-report-grid{grid-template-columns:1fr}.prd-master>.table-wrap{margin-left:-13px;margin-right:-13px;width:calc(100% + 26px)}.prd-tabs{overflow-x:auto}.prd-tabs button{flex:0 0 auto}.prd-exception-detail dl{grid-template-columns:1fr}.prd-period{display:none}}

/* ─── Кабинет перевозчика и вход в порталы сторон ───────────────────────────── */
.portal-signin,.courier-signin{max-width:460px;margin:0 auto;padding:34px 22px 40px;text-align:center}
.portal-signin-mark,.courier-signin-mark{width:60px;height:60px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark)}
.portal-signin-mark svg,.courier-signin-mark svg{width:28px;height:28px}
.portal-signin h1,.courier-signin h1{margin:0 0 6px;font-size:1.45rem;letter-spacing:-.015em}
.portal-signin>p,.courier-signin>p{margin:0 0 24px;color:var(--muted);font-size:.92rem;line-height:1.5}
.portal-account-list,.courier-driver-list{display:grid;gap:10px;text-align:left}
.portal-account-list button,.courier-driver-list button{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer;transition:border-color .15s,transform .15s}
.portal-account-list button:hover,.courier-driver-list button:hover{border-color:var(--accent);transform:translateY(-1px)}
.portal-account-list button>span,.courier-driver-list button>span{flex:0 0 40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:.85rem}
.portal-account-list button>div,.courier-driver-list button>div{flex:1;min-width:0}
.portal-account-list b,.courier-driver-list b{display:block;font-size:.95rem}
.portal-account-list small,.courier-driver-list small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.portal-account-list button>svg,.courier-driver-list button>svg{width:17px;height:17px;color:var(--muted)}
.portal-legal,.courier-legal{margin-top:22px;font-size:.75rem;color:var(--faint)}
.portal-signout{margin-left:auto}

/* Кабинет перевозчика — телефонное приложение, и на десктопе он показывается
   в корпусе телефона, ровно как приложение покупателя: те же 430px и та же
   геометрия, чтобы два макета читались как один и тот же аппарат. На самом
   телефоне корпус снимается (медиазапрос ниже) и экран идёт во всю ширину. */
body.courier-portal-page{background:radial-gradient(circle at 80% 8%,rgba(38,165,161,.15),transparent 32%),linear-gradient(145deg,#e8f0f1,#f6f4ef)}
.courier-shell .portal-content{padding:30px 18px 48px}
.courier-app{position:relative;width:min(430px,100%);min-height:810px;margin:0 auto;padding:0 14px 40px;overflow:hidden;border:1px solid rgba(255,255,255,.85);border-radius:38px;background:rgba(248,250,251,.94);box-shadow:0 35px 100px rgba(18,37,68,.18),inset 0 0 0 1px rgba(18,37,68,.05)}
.courier-header{display:flex;align-items:center;gap:12px;padding:16px 2px 14px}
.courier-driver{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.courier-driver>span{flex:0 0 42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--nav);color:#fff;font-weight:700;font-size:.85rem}
.courier-driver b{display:block;font-size:.97rem}
.courier-driver small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--mono)}
.courier-signout{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.courier-signout svg{width:17px;height:17px}

.courier-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.courier-summary article{padding:12px 13px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.courier-summary span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.courier-summary strong{display:block;margin-top:4px;font-size:1.5rem;line-height:1;letter-spacing:-.02em}

.courier-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.courier-tabs button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:.76rem;cursor:pointer;position:relative}
.courier-tabs button svg{width:17px;height:17px}
.courier-tabs button.active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-soft)}
.courier-tabs button>b{position:absolute;top:4px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:.66rem;display:grid;place-items:center;padding:0 4px}

.courier-list{display:grid;gap:12px}
.courier-list>*{min-width:0}
.courier-task{padding:15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.courier-task.blocked{opacity:.92;border-style:dashed}
.courier-task.return{border-color:var(--danger);background:var(--danger-soft)}
.courier-task.done{padding:13px 15px}
.courier-task>header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.courier-task h3{margin:3px 0 0;font-size:1.02rem;letter-spacing:-.01em}
.courier-task-id{font-family:var(--mono);font-size:.74rem;color:var(--muted)}

.courier-route{display:grid;gap:8px;padding:11px 12px;border-radius:12px;background:var(--bg);margin-bottom:11px}
.courier-route.single{grid-template-columns:1fr}
.courier-point{display:flex;align-items:center;gap:10px}
.courier-point svg{width:17px;height:17px;flex:0 0 17px;color:var(--muted)}
.courier-point.from svg{color:var(--warn)}
.courier-point.to svg{color:var(--accent-dark)}
.courier-point small{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.courier-point b{display:block;font-size:.9rem}

.courier-items{list-style:none;margin:0 0 11px;padding:0;display:grid;gap:5px;min-width:0}
.courier-items li{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;min-width:0}
/* min-width:0 обязателен на каждом звене. У грид- и флекс-элементов минимум по
   умолчанию равен min-content, а из-за white-space:nowrap min-content названия
   товара — это вся его длина. Многоточие на span не помогало: оно обнуляет
   минимум самого span, но не минимум трека, в котором тот лежит. Название
   «Тонометр автоматический OMRON M3 Comfort» растягивало карточку до 644px
   внутри телефона 390px, и правая половина кнопки уходила под overflow. */
.courier-items span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.courier-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:11px;font-size:.78rem;color:var(--muted)}
.courier-meta span{display:inline-flex;align-items:center;gap:5px}
.courier-meta svg{width:14px;height:14px}

.courier-note{display:flex;gap:9px;padding:10px 11px;border-radius:11px;font-size:.8rem;line-height:1.45;margin-bottom:11px}
.courier-note svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px}
.courier-note p{margin:0}
.courier-note.qabd{background:var(--shariah-soft);color:var(--shariah)}
.courier-note.blocked-note{background:var(--warn-soft);color:var(--warn)}
/* Глобальное правило ужимает кнопки до 33px — оно подогнано под миниатюрную
   типографику макета покупателя. Кабинет перевозчика так мельчить нельзя: по
   нему работают пальцем, на улице, часто в перчатках. Держим 48px — выше
   порога WCAG 2.5.5 (44px), потому что это главное действие экрана. */
.courier-action{width:100%;justify-content:center;min-height:48px;padding:12px 16px;font-size:13px;border-radius:14px}
.courier-action svg{width:17px;height:17px}
.courier-signout{min-width:44px;min-height:44px}
.courier-action:disabled{opacity:.5;cursor:not-allowed}

.courier-empty{padding:46px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.courier-empty svg{width:28px;height:28px;margin-bottom:10px;color:var(--faint)}
.courier-empty b{display:block;font-size:.98rem;color:var(--ink)}
.courier-empty span{display:block;margin-top:4px;font-size:.83rem}
.courier-rule{display:flex;gap:11px;margin-top:16px;padding:13px 14px;border-radius:var(--radius);background:var(--shariah-soft);color:var(--shariah);font-size:.82rem;line-height:1.45}
.courier-rule svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.courier-rule b{display:block;margin-bottom:3px}
.courier-rule p{margin:0}

/* Доставка в мобильном приложении покупателя */
.client-delivery-card{padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.client-delivery-card>div:first-child{display:flex;align-items:center;justify-content:space-between;gap:10px}
.client-delivery-card>div:first-child>span{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.client-delivery-card h3{margin:8px 0 12px;font-size:.97rem;line-height:1.35}
.client-delivery-track{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.client-delivery-track span{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:10px;background:var(--bg);color:var(--faint);font-size:.7rem;text-align:center}
.client-delivery-track span svg{width:17px;height:17px}
.client-delivery-track span.done{background:var(--ok-soft);color:var(--ok)}
.client-delivery-track span.current{background:var(--accent-soft);color:var(--accent-dark);font-weight:650}
.client-delivery-track span.issue{background:var(--danger-soft);color:var(--danger)}
.client-delivery-card>small{display:block;font-size:.76rem;color:var(--muted);font-family:var(--mono)}
.client-delivery-issue{color:var(--danger)!important;font-family:inherit!important;margin-top:4px}
.client-delivery-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.client-delivery-actions .btn{justify-content:center}
.vendor-awaiting{display:flex;align-items:center;gap:7px;font-size:.79rem;color:var(--muted);text-align:left}
.vendor-awaiting svg{width:15px;height:15px;flex:0 0 15px}

html[data-theme="dark"] .courier-task,html[data-theme="dark"] .courier-summary article,html[data-theme="dark"] .courier-tabs button,html[data-theme="dark"] .portal-account-list button,html[data-theme="dark"] .courier-driver-list button,html[data-theme="dark"] .client-delivery-card{background:rgba(13,27,44,.55);border-color:rgba(226,240,253,.09)}
html[data-theme="dark"] .courier-route,html[data-theme="dark"] .client-delivery-track span{background:rgba(255,255,255,.04)}
html[data-theme="dark"] .courier-signout{background:rgba(13,27,44,.55);border-color:rgba(226,240,253,.09)}
html[data-theme="dark"] body.courier-portal-page{background:#07121f}
html[data-theme="dark"] .courier-app{background:rgba(9,23,38,.95);border-color:rgba(226,240,253,.1)}

/* На настоящем телефоне корпус не нужен — экран занимает всю ширину. */
@media(max-width:760px){
  .courier-shell .portal-content{padding:0}
  .courier-app{width:100%;min-height:calc(100dvh - 58px);padding:0 14px 40px;border:0;border-radius:0;box-shadow:none;background:transparent}
  /* Тёмное правило выше имеет специфичность (0,2,1), медиазапрос её не повышает.
     Без этой строки на телефоне в тёмной теме осталась бы подложка корпуса. */
  html[data-theme="dark"] .courier-app{background:transparent}
}

/* На узких экранах подпись прячется и таб становится однострочным — но палец
   у водителя тот же, что и на кнопке действия. Держим 44px явно, иначе высота
   падает до 37px. */
@media(max-width:360px){.courier-tabs button span{display:none}.courier-tabs button{flex-direction:row;gap:0;min-height:44px}.client-delivery-actions{grid-template-columns:1fr}}

/* Телефон, повёрнутый боком (844×390, 852×393), по ширине проходит как десктоп,
   и ему рисовался корпус 810px высотой в окне 390px — видна была треть.
   Высота надёжнее ширины: корпус нужен только там, где экран и широкий, и высокий. */
@media(max-height:520px){
  .courier-shell .portal-content{padding:0}
  .courier-app{width:100%;min-height:0;padding:0 14px 32px;border:0;border-radius:0;box-shadow:none;background:transparent}
  html[data-theme="dark"] .courier-app{background:transparent}
  .courier-shell .portal-content>.notice{top:70px;width:min(520px,calc(100vw - 28px))}
}

/* Модалку перевозчик заполняет тем же пальцем, что и карточку: правило 48px не
   должно кончаться на границе модального окна. */
@media(max-width:620px){
  .task-modal .btn,.task-modal button[type=submit]{min-height:46px}
  .task-modal input[type=checkbox]{width:22px;height:22px;min-height:22px}
  .task-modal .modal-x{width:44px;height:44px}
}
.client-card-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}
.client-card-actions .btn{justify-content:center;margin-top:0}
.client-task-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.client-task-actions .btn{justify-content:center;white-space:nowrap}

/* Уведомление теперь можно закрыть (кнопка, клик вне него или автозакрытие),
   поэтому оно больше не блокирует шапку навсегда — pointer-events снова включён. */
.notice{position:relative}.notice-close{flex:0 0 auto;margin-left:auto;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:inherit;opacity:.6;cursor:pointer}.notice-close:hover{opacity:1;background:rgba(0,0,0,.06)}.notice-close svg{width:13px;height:13px}
/* Плашка должна оставаться внутри корпуса телефона и ниже его шапки.
   Порядок правил здесь принципиален: специфичность у обоих одинаковая (0,2,1),
   и медиазапрос её не повышает — побеждает то, что ниже. Раньше мобильное
   правило стояло выше и было мёртвым, а десктоп получал мобильную геометрию:
   плашка 520px торчала из корпуса 430px и садилась на имя водителя. */
.courier-shell .portal-content>.notice{top:186px;width:min(400px,calc(100vw - 28px))}
@media(max-width:760px){
  .courier-shell .portal-content>.notice{top:70px;width:min(520px,calc(100vw - 28px))}
}

/* Ведение заявки: ответственный и переписка (SC-02) */
.assignment-panel{margin:16px 0 0;padding:15px 17px;border-top:1px solid var(--line)}
.assignment-panel h3{margin:0;font-size:.98rem}
.assignment-thread{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:9px}
.assignment-thread li{padding:10px 12px;border-radius:11px;background:var(--bg);font-size:.85rem}
.assignment-thread b{margin-right:8px}
.assignment-thread small{color:var(--muted);font-size:.74rem}
.assignment-thread p{margin:5px 0 0}
html[data-theme="dark"] .assignment-thread li{background:rgba(255,255,255,.04)}
.signature-canvas{display:block;width:100%;height:200px;margin:12px 0 4px;border:1px dashed var(--line-strong,#cad0d6);border-radius:12px;background:#fff;touch-action:none;cursor:crosshair}
.signature-pad-actions{display:flex;justify-content:flex-end}
.wad-document-wrap{max-height:60vh;overflow:auto;padding:0 22px}
.wad-document{font-size:13px;line-height:1.5;color:var(--ink,#1c2530)}
.wad-document h1{font-size:16px;text-align:center;margin:8px 0 2px}
.wad-document .wad-sub{text-align:center;color:var(--muted,#5b6773);margin:0 0 14px;font-style:italic}
.wad-document h2{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.02em}
.wad-document p{margin:0 0 8px}
.wad-document .wad-note{color:var(--muted,#5b6773);font-size:12px;font-style:italic}
.wad-table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.wad-table th,.wad-table td{border:1px solid var(--line-strong,#cad0d6);padding:6px 8px;text-align:left;font-size:12px;vertical-align:top}
.wad-table th{background:var(--surface-2,#f4f6f8);font-weight:600}
.wad-gap{color:var(--muted,#5b6773)}
.wad-signatures td{width:50%}
.wad-sign-cell{min-height:60px}
.wad-signature-img{max-width:220px;max-height:80px;display:block;margin-top:4px}
@media print{.modal-head,.application-detail-actions,.modal-x{display:none!important}.modal-backdrop{position:static;background:none}.modal{box-shadow:none;max-height:none}.wad-document-wrap{max-height:none;overflow:visible}}

</style>
</head>
<body>
<div id="root"></div>
<script>

  // Реквизиты Nurfin как стороны Wa'd — постоянны для всех сделок демо.
  var NURFIN_ORG = { name: "«NUR FINANCE» MChJ", inn: "[STIR to'ldiriladi]", address: "Toshkent shahri" };
  var wadForm = { place: "Toshkent shahri", clientAddress: "", repName: "", repPosition: "", repBasis: "Ustav" };
  var signatureHasStroke = false;
  function wadBlank(value) {
    return value ? esc(value) : `<span class="wad-gap">[__________]</span>`;
  }
  function wadSum(n) {
    return n || n === 0 ? `${Math.round(n).toLocaleString("ru-RU")} сум` : `<span class="wad-gap">[____________]</span> сум`;
  }
  function buildWadFieldsFromLocal(deal) {
    const extras = getExtras(deal.id) ?? {};
    const c = ops.clients.find((x) => x.inn === deal.clientInn);
    const s = ops.suppliers.find((x) => x.inn === deal.supplierInn);
    const product2 = productFor(deal.id);
    const items = extras.items ?? [];
    const amount = Number(deal.requestedAmount) / 100;
    const markup = product2 ? amount * product2.markupRate : 0;
    const deposit = product2 ? amount * product2.depositRate : 0;
    const promise = deal.promise;
    return {
      dealId: deal.id,
      place: promise?.place ?? wadForm.place,
      date: promise?.registeredAt ? new Date(promise.registeredAt).toLocaleDateString("ru-RU") : new Date().toLocaleDateString("ru-RU"),
      client: { name: c?.name ?? deal.clientInn, inn: c?.inn ?? deal.clientInn, address: promise?.clientAddress ?? wadForm.clientAddress, repName: promise?.repName ?? wadForm.repName, repPosition: promise?.repPosition ?? wadForm.repPosition, repBasis: wadForm.repBasis },
      supplier: { name: s?.name ?? deal.supplierInn, inn: s?.inn ?? deal.supplierInn },
      items: items.map((i) => ({ name: i.name, sku: i.sku, qty: i.qty, unitPrice: Number(i.unitPrice) / 100 })),
      deliveryAddress: promise?.clientAddress ?? wadForm.clientAddress,
      amount, markup, markupRate: product2?.markupRate ?? null,
      termDaysProduct: product2?.code?.split("-")[1] ?? null, installments: product2?.installments ?? null,
      deposit, wadTermDays: 30, signatureUrl: promise?.signatureUrl ?? null
    };
  }
  /** Wa'd hujjatining to'liq matni — faqat lokal maydonlardan yig'iladi, hech qanday server so'rovi yo'q. */
  function wadDocumentHtml(f) {
    const salePrice = f.amount + f.markup;
    const itemsRows = (f.items?.length ? f.items : [{}]).slice(0, 6).map((it, i) => `<tr><td>${i + 1}</td><td>${wadBlank(it.name)}</td><td>${wadBlank(it.sku)}</td><td>${it.qty ? esc(String(it.qty)) : wadBlank()}</td><td>${wadBlank(f.supplier.name)}</td><td>${it.unitPrice ? wadSum(it.unitPrice) : wadBlank()}</td></tr>`).join("");
    return `<article class="wad-document">
    <h1>PROMISE TO PURCHASE (WA'D)</h1>
    <p class="wad-sub">Murabaha asosida sotib olish bo'yicha bir tomonlama majburiy va'da</p>
    <table class="wad-table"><tr><th>Wa'd №</th><th>Sana</th><th>Joy</th></tr><tr><td>${esc(f.dealId)}</td><td>${esc(f.date)}</td><td>${wadBlank(f.place)}</td></tr></table>
    <h2>1. TOMONLAR</h2>
    <p><b>1.1. Va'da beruvchi (Customer)</b><br>Tashkilot nomi: ${wadBlank(f.client.name)}<br>STIR: ${wadBlank(f.client.inn)}<br>Manzil: ${wadBlank(f.client.address)}<br>Vakil: ${wadBlank(f.client.repName)}<br>Lavozimi: ${wadBlank(f.client.repPosition)}<br>Asos: ${wadBlank(f.client.repBasis)}<br>keyingi o'rinlarda «Mijoz» yoki «Va'da beruvchi» deb yuritiladi.</p>
    <p><b>1.2. Kelajakdagi sotuvchi</b><br>${esc(NURFIN_ORG.name)}<br>STIR: ${esc(NURFIN_ORG.inn)}<br>Manzil: ${esc(NURFIN_ORG.address)}<br>keyingi o'rinlarda «Nurfin» deb yuritiladi.</p>
    <h2>2. VA'DANING MAQSADI</h2>
    <p>2.1. Mijoz o'z biznes ehtiyojlari uchun quyida ko'rsatilgan tovar(lar)ni sotib olish istagini bildiradi va Nurfin'dan ushbu tovar(lar)ni Mijozga keyinchalik Murabaha savdosi asosida sotish maqsadida sotib olishini so'raydi.</p>
    <p>2.2. Mijoz Nurfin ushbu Wa'dga tayanib tegishli tovarni yetkazib beruvchidan sotib olganidan, tovar ustidan mulk huquqini va Shariat talablariga muvofiq zarur qabd/egalikni qo'lga kiritganidan so'ng, mazkur tovarni Nurfin'dan Murabaha orqali sotib olishga bir tomonlama va majburiy va'da beradi (Wa'd).</p>
    <p>2.3. Ushbu Wa'd Murabaha oldi-sotdi shartnomasi hisoblanmaydi, tovar ushbu hujjat imzolanishi bilan Mijozga sotilgan hisoblanmaydi va Mijoz zimmasida Murabaha savdo narxi bo'yicha qarzdorlik yuzaga keltirmaydi.</p>
    <p>2.4. Murabaha oldi-sotdi shartnomasi Nurfin tovarni o'z nomidan sotib olganidan va unga nisbatan Shariat talablariga muvofiq mulk huquqi hamda qabdni qo'lga kiritganidan keyin alohida tuziladi.</p>
    <h2>3. TOVAR TO'G'RISIDA MA'LUMOT</h2>
    <p>Tovar nomi: ${wadBlank(f.items?.[0]?.name)}<br>Miqdori: ${f.items?.[0]?.qty ? esc(String(f.items[0].qty)) : wadBlank()}<br>Yetkazib beruvchi: ${wadBlank(f.supplier.name)}<br>Taxminiy xarid qiymati: ${wadSum(f.amount)}<br>Yetkazib berish manzili: ${wadBlank(f.deliveryAddress)}</p>
    <p class="wad-note">Tovarning batafsil tavsifi ushbu Wa'dning 1-ilovasi — Tovar spetsifikatsiyasida keltirilgan.</p>
    <h2>4. MUROBAHA SHARTLARINING INDIKATIV PARAMETRLARI</h2>
    <p>Nurfinning taxminiy xarid qiymati: ${wadSum(f.amount)}<br>Murabaha ustamasi: ${wadSum(f.markup)}${f.markupRate ? ` (${(f.markupRate * 100).toFixed(1)}%)` : ""}<br>Taxminiy Murabaha sotuv narxi: ${wadSum(salePrice)}<br>To'lov muddati: ${f.termDaysProduct ? `${esc(String(f.termDaysProduct))} kun` : wadBlank()}<br>To'lov davriyligi: oylik<br>Bo'lib to'lovlar soni: ${f.installments ? esc(String(f.installments)) : wadBlank()}</p>
    <p class="wad-note">Yakuniy Murabaha narxi va to'lov jadvali Nurfinning tovarni sotib olish bilan bog'liq Shariat tomonidan ruxsat etilgan haqiqiy xarajatlari va tomonlar kelishgan Murabaha ustamasi asosida Murabaha shartnomasida belgilanadi.</p>
    <h2>5. NURFIN TOMONIDAN TOVARNI SOTIB OLISH</h2>
    <p>5.1. Ushbu Wa'd Mijoz tomonidan berilganidan so'ng Nurfin o'z qarori va ichki tasdiqlash jarayonlari asosida tovarni Supplier'dan sotib olishi mumkin.</p>
    <p>5.2. Supplier bilan tovarni sotib olish bo'yicha bitimning xaridori Nurfin bo'ladi, bundan Mijoz Nurfinning alohida Wakalah topshirig'i asosida agent sifatida harakat qiladigan holatlar mustasno.</p>
    <p>5.3. Nurfin tovarni sotib olgandan keyin tovar Nurfin mulkiga o'tishi va Nurfin tovar bilan bog'liq mulkdorlik riskini Shariat talablariga muvofiq o'z zimmasiga olishi lozim.</p>
    <p>5.4. Tovar Nurfin mulkiga o'tishi va zarur qabd amalga oshirilishidan oldin Mijoz bilan Murabaha oldi-sotdi shartnomasi tuzilmaydi.</p>
    <h2>6. MIJOZNING VA'DASI</h2>
    <p>6.1. Mijoz Nurfin ushbu Wa'dga tayanib 3-bo'limda ko'rsatilgan tovarni sotib olganidan va unga nisbatan Shariat talablariga muvofiq mulk huquqi hamda qabdni qo'lga kiritganidan so'ng, Nurfin tomonidan taqdim etiladigan Murabaha shartnomasini tuzishga va tovarni kelishilgan Murabaha shartlari asosida sotib olishga va'da beradi.</p>
    <p>6.2. Mijoz mazkur Wa'dni Nurfinning tovarni sotib olishiga sabab bo'luvchi va Nurfin tomonidan ushbu Wa'dga tayanilishiga mo'ljallangan va'da sifatida berayotganini tasdiqlaydi.</p>
    <p>6.3. Ushbu Wa'dning majburiyligi amaldagi qonunchilik, tomonlar o'rtasidagi kelishuv va Nurfin Shariat kengashi tomonidan tasdiqlangan Shariat qoidalari doirasida qo'llaniladi.</p>
    <h2>7. VA'DANI BAJARMASLIK</h2>
    <p>7.1. Agar Nurfin ushbu Wa'dga tayanib tovarni sotib olganidan keyin Mijoz Shariat tomonidan tan olinadigan asosli sabab mavjud bo'lmagan holda o'z va'dasini bajarmasa, Mijozning javobgarligi Nurfinning mazkur Wa'dga tayanishi natijasida yuzaga kelgan haqiqiy va bevosita zarar (actual direct loss) bilan cheklanadi.</p>
    <p>7.2. Bunday zarar, jumladan, Nurfin tovarni uchinchi shaxsga sotishga majbur bo'lgan holatda, Nurfinning tovarni sotib olish uchun qilgan haqiqiy xarajatlari bilan uni realizatsiya qilishdan olingan sof tushum o'rtasidagi manfiy farqni o'z ichiga olishi mumkin.</p>
    <p>7.3. Kompensatsiya Nurfin Murabaha bitimi tuzilganida olishi kutilgan foydani, kelajakdagi Murabaha ustamasini yoki boy berilgan foydani undirish vositasi sifatida ishlatilmaydi.</p>
    <p>7.4. Nurfin zarar miqdorini asoslovchi tegishli hujjatlarni taqdim etishi lozim.</p>
    <h2>8. HAMISH JIDDIYYAH / SECURITY DEPOSIT</h2>
    <p class="wad-note">Ushbu bo'lim faqat Nurfin mahsulot strukturasi bo'yicha qo'llaniladigan holatlarda ishlatiladi.</p>
    <p>8.1. Mijoz o'zining tovarni sotib olishga bo'lgan jiddiyligini tasdiqlash maqsadida ${wadSum(f.deposit)} miqdorida Hamish Jiddiyyah (security deposit) taqdim etishi mumkin.</p>
    <p>8.2. Mazkur summa Murabaha bo'yicha oldindan to'langan savdo narxi hisoblanmaydi.</p>
    <p>8.3. Agar Mijoz Wa'dni bajarsa, mazkur summa tomonlarning kelishuvi va Shariat kengashi tasdiqlagan mahsulot qoidalariga muvofiq Mijozga qaytarilishi yoki Murabaha bo'yicha tegishli to'lovlarga hisobga olinishi mumkin.</p>
    <p>8.4. Agar Mijoz Wa'dni bajarmasa, Nurfin faqat Shariat talablariga muvofiq isbotlangan haqiqiy zararni ushbu summadan qoplashi mumkin. Qolgan summa Mijozga qaytariladi.</p>
    <h2>9. MUROBAHA SHARTNOMASINING ALOHIDALIGI</h2>
    <p>9.1. Tomonlar quyidagi huquqiy va Shariat jarayonlari bir-biridan alohida ekanligini tan oladilar: 1-bosqich — Purchase Request; 2-bosqich — Wa'd; 3-bosqich — Purchase &amp; Ownership; 4-bosqich — Murabaha Offer &amp; Contract; 5-bosqich — Delivery &amp; Repayment.</p>
    <p>9.2. Ushbu Wa'dning imzolanishi Murabaha savdosining avtomatik ravishda tuzilganligini anglatmaydi.</p>
    <h2>10. SHARIAT TALABLARI</h2>
    <p>10.1. Ushbu Wa'd va undan kelib chiqadigan Murabaha operatsiyasi Islom moliyasi tamoyillari hamda Nurfin tomonidan qabul qilingan Shariat standartlariga muvofiq amalga oshiriladi.</p>
    <p>10.2. Nurfin tovarni Mijozga sotishdan oldin tovar ustidan Shariat talablariga muvofiq mulk huquqi va qabdni qo'lga kiritishi lozim.</p>
    <p>10.3. Nurfin tovarni sotib olish va uni Mijozga Murabaha asosida sotish o'rtasidagi davrda Shariat talablariga muvofiq mulkdor sifatidagi tegishli risklarni o'z zimmasiga oladi.</p>
    <p>10.4. Wa'd va keyingi Murabaha shartnomasi bitta oldi-sotdi shartnomasi sifatida talqin qilinmasligi lozim.</p>
    <h2>11. AMAL QILISH MUDDATI</h2>
    <p>Ushbu Wa'd imzolangan kundan boshlab kuchga kiradi va quyidagilardan biri yuz bergunga qadar amal qiladi: tomonlar o'rtasida tegishli Murabaha shartnomasi tuzilishi; Nurfin Mijozga tovarni sotib olishni amalga oshirmasligi haqida xabar berishi; ${f.wadTermDays ?? 30} kunlik Wa'd muddati tugashi; Shariat yoki qonunchilik nuqtai nazaridan bitimni amalga oshirish mumkin bo'lmay qolishi.</p>
    <h2>12. YAKUNIY QOIDALAR</h2>
    <p>12.1. Ushbu Wa'd Mijoz tomonidan Nurfin foydasiga berilgan bir tomonlama va'dadir.</p>
    <p>12.2. Ushbu hujjatning hech bir qoidasi Nurfin tovarni o'z mulkiga olmasdan turib Mijozga sotgan deb talqin qilinmaydi.</p>
    <p>12.3. Ushbu Wa'd O'zbekiston Respublikasi qonunchiligi, Nurfinning tegishli Shariat siyosatlari va qo'llaniladigan Shariat standartlari doirasida talqin qilinadi.</p>
